<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon.ico">
    <link rel="stylesheet" href="main.css">
    <title>Graaaah!</title>
    <style>
        /* ENTER OVERLAY */
        #enter-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            transition: opacity 0.6s ease;
        }

        #enter-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Hide main content until entered */
        #main-content {
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #main-content.visible {
            opacity: 1;
        }

        #enter-main {
        }

        #enter-main:hover {
        }

        @keyframes pulse {
            0%, 100% { opacity: 1;}
            50%       { opacity: 0.5;}
        }

        .enter-main:hover {
            animation: pulse 1s ease-in-out infinite;
            cursor: pointer;
        }

        #danmaku-container {
            position: fixed;
            inset: 0;
            z-index: 1001;
            pointer-events: none;
            overflow: hidden;
        }

        .danmaku-text {
            position: absolute;
            white-space: nowrap;
            animation: danmaku-scroll linear forwards;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: normal;
            color: white;
            margin: 0 !important;
        }

        @keyframes danmaku-scroll {
            from { transform: translateX(100vw); }
            to   { transform: translateX(-100%); }
        }

        #network-icon {
            position: fixed;
            top: 55%;
            left: 25%;
            z-index: 10;
        }

        #network-icon img {
            width: 64px;
            height: auto;
            filter: grayscale(100%) opacity(0.5);
            transition: filter 0.3s ease;
            cursor: pointer;
        }

        #network-icon img:hover {
            filter: grayscale(0%) opacity(1);
        }
    </style>
</head>
<body>
<div id="danmaku-container"></div>

<div class="background"></div>

<!-- ENTER OVERLAY -->
<div id="enter-overlay">
    <div id="enter-main" class="text enter-main">F A N C Y M A N I A</div>
</div>


<!-- MAIN CONTENT -->
<div id="main-content">
    <div class="grid-container">
        <div class="grid-item">
            <a href="https://github.com/TheFancy" target="_blank">
                <img src="assets/images/github.png" alt="GitHub">
            </a>
        </div>
        <div class="grid-item">
            <img src="assets/images/discord.png" alt="Discord">
        </div>
        <div class="grid-item">
            <a href="https://osu.ppy.sh/users/1969051" target="_blank">
                <img src="assets/images/osu.png" alt="Osu">
            </a>
        </div>
        <div class="grid-item">
            <a href="https://steamcommunity.com/id/TheFancy/" target="_blank">
                <img src="assets/images/steam.png" alt="steam">
            </a>
        </div>
    </div>
    <div class="image-container">
        <img src="assets/images/pfpgif.gif" alt="Centered Image">
    </div>
    <div class="text">F A N C Y M A N I A</div>
    <div class="text-small">
        <div id="quote-container"></div>
    </div>
    <div class="text-small">
        <p>- Fancy </p>
        <p>- 28</p>
        <p>- He/Him</p>
        <p>- Quadruple Pisces</p>
    </div>
    <!-- NETWORK ICON -->
    <a href="https://lab.fancymania.me" target="_blank" id="network-icon">
        <img src="assets/images/network.png" alt="Network">
    </a>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const hasEntered = sessionStorage.getItem("fancymania-entered");

        const overlay = document.getElementById("enter-overlay");
        const main = document.getElementById("main-content");
        const danmaku = document.getElementById("danmaku-container");

        // Background logic (runs either way)
        const folderPath = "assets/backgrounds/";
        const imageCount = 3;
        const randomIndex = Math.floor(Math.random() * imageCount) + 1;
        const randomImage = `${folderPath}background${randomIndex}.png`;
        const targetDiv = document.querySelector(".background");
        if (targetDiv) {
            targetDiv.style.backgroundImage = `url('${randomImage}')`;
            targetDiv.style.backgroundSize = "cover";
            targetDiv.style.backgroundPosition = "center";
        }

        // Skip the intro entirely on return visits
        if (hasEntered) {
            overlay.style.display = "none";
            danmaku.style.display = "none";
            main.classList.add("visible");
            return;
        }

        // First-visit path: danmaku + overlay
        const messages = ["F A N C Y M A N I A"];

        function spawnDanmaku() {
            const container = document.getElementById("danmaku-container");
            const el = document.createElement("div");
            el.classList.add("danmaku-text", "text");
            el.textContent = messages[Math.floor(Math.random() * messages.length)];
            el.style.top = Math.random() * 90 + "vh";
            el.style.opacity = 0.2 + Math.random() * 0.4;
            const duration = 6 + Math.random() * 6;
            el.style.animationDuration = duration + "s";
            container.appendChild(el);
            setTimeout(() => el.remove(), duration * 1000);
        }

        const danmakuInterval = setInterval(spawnDanmaku, 50);

        document.getElementById("enter-main").addEventListener("click", function () {
            sessionStorage.setItem("fancymania-entered", "true");

            overlay.classList.add("hidden");
            danmaku.classList.add("hidden");
            clearInterval(danmakuInterval);

            setTimeout(() => {
                overlay.style.display = "none";
                danmaku.style.display = "none";
                main.classList.add("visible");
            }, 600);
        });
    });
</script>

</body>
</html>
